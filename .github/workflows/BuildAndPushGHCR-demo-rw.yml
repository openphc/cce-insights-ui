name: UI Rwanda CI and GHCR Push

on:
  push:
    branches: [ "demo-rw" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_URI: ghcr.io/${{ github.repository }}
  # Branch-scoped incremental release tags: demo-rw-v1, demo-rw-v2, ... (one new tag per successful build)
  VERSION_TAG_PREFIX: demo-rw-v
  LATEST_TAG: demo-rw-latest
  # Country display timezone (IANA name), baked into the image. Set per country branch:
  # each country's branch carries its own value here (Rwanda = Africa/Kigali, UTC+2).
  VITE_TIMEZONE: Africa/Kigali

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Determine next version tag
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        OWNER="${{ github.repository_owner }}"
        PKG="${{ github.event.repository.name }}"
        PREFIX="${VERSION_TAG_PREFIX}"
        TAGS=$(gh api "/orgs/${OWNER}/packages/container/${PKG}/versions?per_page=100" \
          --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -E "^${PREFIX}[0-9]+$" || true)
        if [ -z "$TAGS" ]; then
          VERSION_TAG="${PREFIX}1"
        else
          MAX_NUM=$(echo "$TAGS" | sed "s/^${PREFIX}//" | sort -n | tail -1)
          VERSION_TAG="${PREFIX}$((MAX_NUM + 1))"
        fi
        echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
        echo "Version tag for this build: ${VERSION_TAG}"

    - name: Build container image
      # Bake the Keycloak config so the SPA performs OIDC login and sends a Bearer token to
      # the gateway-protected /v1/insights API. Without VITE_AUTH_ENABLED=true the auth code
      # is tree-shaken out at build time.
      #
      # These values are the SAME across environments, so they are safe to bake:
      #   - realm + client are identical on UAT and PROD
      #   - the Keycloak URL is DERIVED at runtime from the browser origin (same domain as the
      #     UI), so it is intentionally left empty here -> the same image works on UAT and PROD.
      # All are overridable via repo/org Actions Variables (Settings -> Secrets and variables
      # -> Actions -> Variables) if a build ever needs a fixed/remote Keycloak URL.
      run: |
        docker build \
          --build-arg VITE_AUTH_ENABLED="${{ vars.VITE_AUTH_ENABLED || 'true' }}" \
          --build-arg VITE_KEYCLOAK_URL="${{ vars.VITE_KEYCLOAK_URL || '' }}" \
          --build-arg VITE_KEYCLOAK_REALM="${{ vars.VITE_KEYCLOAK_REALM || 'cce' }}" \
          --build-arg VITE_KEYCLOAK_CLIENT_ID="${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'cce-insights-ui' }}" \
          --build-arg VITE_ROUTER_BASE="${{ vars.VITE_ROUTER_BASE || '/insights' }}" \
          --build-arg VITE_TIMEZONE="${{ env.VITE_TIMEZONE }}" \
          -t ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} .

    - name: Tag image as latest
      run: docker tag ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} ${IMAGE_URI}:${LATEST_TAG}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push version and latest to GHCR
      run: |
        VERSION_TAG="${{ steps.version.outputs.version_tag }}"
        docker push ${IMAGE_URI}:${VERSION_TAG}
        docker push ${IMAGE_URI}:${LATEST_TAG}
